<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History</title>
  <link rel="stylesheet" href="full-history.css">
  <link rel="stylesheet" href="/main-sidebar.css">
  <link rel="stylesheet" href="user-dashboard.css">

</head>
<body>
  <div class="layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="history-grid">

        <!-- LEFT: MONEY FLOW DONUT -->
        <div class="insights-card">
          <div class="insights-head">
            <h3 class="insights-title">Money Flow</h3>
            <p class="insights-sub">All-time overview</p>
          </div>

          <div class="donut-wrap">
            <svg class="donut" viewBox="0 0 200 200">
              <circle class="donut-track"    cx="100" cy="100" r="80"></circle>
              <circle class="donut-received" cx="100" cy="100" r="80" id="arcReceived"></circle>
              <circle class="donut-sent"     cx="100" cy="100" r="80" id="arcSent"></circle>
            </svg>
            <div class="donut-center">
              <div class="donut-stat">
                <span class="donut-stat-label">Received</span>
                <span class="donut-stat-val received" id="centerReceived">0%</span>
              </div>
              <span class="donut-stat-divider"></span>
              <div class="donut-stat">
                <span class="donut-stat-label">Sent</span>
                <span class="donut-stat-val sent" id="centerSent">0%</span>
              </div>
            </div>
          </div>

          <div class="legend">
            <div class="legend-row">
              <span class="legend-left"><span class="dot dot-received"></span> Received</span>
              <span class="legend-val" id="legendReceived">₦0.00</span>
            </div>
            <div class="legend-row">
              <span class="legend-left"><span class="dot dot-sent"></span> Sent</span>
              <span class="legend-val" id="legendSent">₦0.00</span>
            </div>
          </div>
        </div>

        <!-- RIGHT: TRANSACTION HISTORY -->
        <div class="history-panel">
          <div class="filter-section">
            <button class="filter-btn active" onclick="filterTransactions('all', event)">
              All
            </button>
            <button class="filter-btn" onclick="filterTransactions('sent', event)">
              Sent
            </button>
            <button class="filter-btn" onclick="filterTransactions('received', event)">
               Received
            </button>
          </div>

          <!-- TRANSACTIONS (CHANGES WHEN FILTER CLICKED) -->
          <div class="section"></div>
        </div>

      </div>
    </div>
  </div>



<!-- BOTTOM NAVIGATION (like Opay) -->
<div class="actions">
  <div class="action">
    <a class="adeco" href="user-dashboard.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
    </a>
    <span><a style="text-decoration: none; color: black;" href="user-dashboard.html">Home</a></span>
  </div>
  <div class="action">
    <a class="adeco" href="transaction.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
    </a>
    <span><a style="text-decoration: none; color: black;" href="transaction.html">Transfer</a></span>
  </div>
  <div class="action">
    <a class="adeco" href="deposit.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></svg>

    <span><a style="text-decoration: none; color: black;" href="deposit.html">Deposit</a></span>
